[package]
name = "scasim"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
itertools = "0.15.0"
wellen = "0.25.6"
fst-reader = "0.17"
# must match the ndarray version of scalib (pinned to 0.16 by its nshare dependency)
ndarray = { version = "0.16.1", features = ["approx", "rayon", "serde"] }
ndarray-npz = "0.4.2"
# Only `plotly_embed_js`. The features for static export (`static_export_*`, `plotly_image`)
# start a browser driver. Static images come from plotters.
plotly = { version = "0.14.1", default-features = false, features = ["plotly_embed_js"] }
# Static SVG and PNG. `ab_glyph` is a pure-Rust font engine. The default `ttf` feature
# (font-kit, FreeType, fontconfig) must stay off.
plotters = { version = "0.3.7", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "svg_backend",
    "ab_glyph",
    "line_series",
] }
# Direct dependency only to enable `bitmap_encoder` of the SVG backend, which embeds a
# raster image (for the heatmap of plan A2c). It is the crate that `plotters` uses.
plotters-svg = { version = "0.3.7", features = ["bitmap_encoder"] }
scalib = { path = "deps/SCALib/src/scalib_ext/scalib" }
flate2 = "1.1.10"
serde_json = "1.0.151"
miette = { version = "7.6.0", features = ["fancy"] }
thiserror = "2.0.21"
log = "0.4.27"
env_logger = "0.11.11"
rayon = "1.10.0"
regex = "1"

[dev-dependencies]
approx = "0.5.1"
ndarray-rand = "0.15.0"
ndarray-stats = "0.6.0"
fst-writer = "0.3.1"
proptest = "1"
tempfile = "3"
cpu-time = "1.0.0"
# Only to decode the PNG files in the plot tests. It is the crate and version that plotters uses.
image = { version = "0.24.9", default-features = false, features = ["png"] }

[lib]
bench = false

[[bin]]
name = "tvla"

[profile.dev]
opt-level = 1               # Use slightly better optimizations.
overflow-checks = false     # Disable integer overflow checks.

# Fork under development; see docs/superpowers/specs/2026-10-08-fast-power-design.md.
# The patch applies to the whole dependency graph, so wellen uses the same fst-reader.
[patch.crates-io]
fst-reader = { path = "fst-reader" }

# The tests decompress and parse waveform files. Optimized code makes them much faster.
# The first setting affects every dev build, not only the tests: all dependencies, including
# `fst-reader`, compile with `opt-level = 3` also in a normal `cargo build`. Only this package
# keeps `opt-level = 1` there.
[profile.dev.package."*"]
opt-level = 3

# The tests of this package compile with more optimization than a dev build.
[profile.test]
opt-level = 2
overflow-checks = true
