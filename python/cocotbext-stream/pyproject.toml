[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocotbext-stream"
version = "0.1.0"
description = "Low-overhead valid/ready stream drivers, monitors, and scoreboards for cocotb 2.1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cocotb>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocotbext.*"]
namespaces = true

[tool.setuptools.package-data]
"cocotbext.stream" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
